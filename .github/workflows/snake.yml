name: Generate profile graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#cc0000

      - name: Fetch streak cards
        run: |
          base="https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&hide_border=true&ring=CC0000&fire=CC0000&currStreakLabel=CC0000"
          curl -sfL --retry 5 --retry-delay 10 --max-time 60 -o streak.svg "$base&theme=default"
          curl -sfL --retry 5 --retry-delay 10 --max-time 60 -o streak-dark.svg "$base&theme=tokyonight"
          grep -q "Total Contributions" streak.svg && grep -q "Total Contributions" streak-dark.svg
          sudo mv streak.svg streak-dark.svg dist/

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
